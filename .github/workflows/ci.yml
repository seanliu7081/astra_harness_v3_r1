name: Offline validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install from the checkout
        run: python -m pip install '.[dev]'
      - name: Run offline behavioral regressions
        run: python -m pytest -q
      - name: Inspect an original task without a simulator or credentials
        run: python scripts/launch.py inspect --task libero_10_t4 --vision off
      - name: Inspect a bundled custom task
        run: python scripts/launch.py inspect --task t04_can_obstacle --vision off
      - name: Verify frozen r1 source and packaged scene hashes
        run: python scripts/verify_repository.py
